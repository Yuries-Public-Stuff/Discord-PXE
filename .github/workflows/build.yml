name: build

on:
  push:
  pull_request:

jobs:
  controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
      - run: go test ./...

  pxe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        shell: powershell
        run: choco install nasm -y --no-progress
      - name: Build PXE images
        shell: powershell
        run: .\tools\build.ps1
